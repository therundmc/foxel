name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: foxel-vsix
          path: '*.vsix'
          if-no-files-found: error
